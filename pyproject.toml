[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kipert"
version = "0.1.0"
description = "Kernel models for unseen perturbation responses and measured-response transfer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.11,<2", "pandas>=2.0,<3"]

[project.optional-dependencies]
review = ["matplotlib==3.9.2", "nbclient==0.10.2", "ipykernel==6.29.5", "nbformat>=5.9,<6"]
workbooks = ["openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["kipert", "kipert.*"]
